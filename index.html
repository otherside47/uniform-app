<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Uniform</title>
  <link rel="stylesheet" href="shared/fonts.css">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .home { max-width: 520px; margin: 0 auto; padding: 56px 20px; }
    .home h1 { font-size: 28px; margin-bottom: 4px; }
    .home a.card { display: block; padding: 18px 20px; margin-top: 12px; background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); color: inherit; text-decoration: none; }
    .home a.card:hover, .home a.card:focus-visible { border-color: var(--primary); }
    .home a.card b { display: block; font-size: 17px; }
    .home a.card span { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main class="home">
    <h1>Uniform</h1>
    <p class="muted">Local Guard Force · Ashgabat</p>
    <a class="card" href="guard/"><b>Guard · Охранник · Garawul</b><span>Items, requests, signature</span></a>
    <a class="card" href="admin/"><b>Admin · Админ</b><span>Requests, stock, orders, accounts</span></a>
    <a class="card" href="gso/"><b>GSO</b><span>Read-only monitoring</span></a>
  </main>
</body>
</html>
